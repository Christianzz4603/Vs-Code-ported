name: Build & Deploy Workflow

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Grant permissions required for build artifacts and GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "build-and-deploy-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Compile, Test & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0"
        shell: bash

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Compile Kotlin Code
        run: ./gradlew compileDebugKotlin

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-studio-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-studio-release-apk
          path: app/build/outputs/apk/release/*.apk

  deploy-docs:
    name: Deploy GitHub Pages Documentation
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Documentation Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
